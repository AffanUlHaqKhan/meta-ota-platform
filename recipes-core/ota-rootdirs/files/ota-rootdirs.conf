# OSTree drops everything the build placed under /var: it is not part of the
# commit, and is created empty on first boot. systemd-tmpfiles is what puts the
# expected directories back.
#
# systemd's own home.conf has `Q /home` (which resolves through the
# /home -> var/rootdirs/home symlink), but nothing creates root's home, and
# poky sets root's shell home to /home/root. Without this, every root login --
# serial or ssh -- starts in a directory that does not exist.
d /home/root 0700 root root -
