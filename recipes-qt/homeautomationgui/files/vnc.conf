# Switch the HMI to Qt's VNC platform plugin.
#
# Renders to a VNC server on :5900 instead of the display, so the UI can be
# viewed from a laptop over the network with no HDMI monitor attached. Useful
# during bring-up; not for production -- Qt's VNC plugin has no authentication
# and no encryption, so anyone who can reach port 5900 sees and controls the UI.
[Service]
Environment=QT_QPA_PLATFORM=vnc
