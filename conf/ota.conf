# Append to build/conf/local.conf (or include it).
# Everything here is what turns a normal image into an OSTree-updatable one.

MACHINE ?= "raspberrypi5"

# sota.bbclass ends with `inherit sota_sanity sota_${SOTA_MACHINE}`, and
# meta-updater maps every Pi to its own Pi2/3/4 class via `SOTA_MACHINE:rpi ?=
# "raspberrypi"`. That class is u-boot-only and has no Pi 5 support, so point
# the override at our own class in classes/sota_raspberrypi5.bbclass.
# This must be the :rpi override, not the bare variable -- `rpi` is in
# MACHINEOVERRIDES for every Pi, so the override always wins over the base.
SOTA_MACHINE:rpi = "raspberrypi5"

# --- OSTree / meta-updater -------------------------------------------------
DISTRO_FEATURES:append = " sota systemd usrmerge"
DISTRO_FEATURES:remove = "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"

# meta-updater's layer.conf does NOT inherit sota.bbclass -- adding the layer
# and the 'sota' DISTRO_FEATURE alone does nothing. This line is what pulls in
# image_types_ostree / image_types_ota, the OSTree-aware .wks, the u-boot
# bootloader wiring and the machine class (sota_${SOTA_MACHINE}).
INHERIT += "sota"

# sota.bbclass assumes the OTA Community Edition backend: it appends
# 'ostreepush garagesign garagecheck ota-ext4' to IMAGE_FSTYPES -- the first
# three need aktualizr-native and the garage-sign tool -- and installs
# aktualizr on the device. We publish with scripts/push-ostree.sh and update
# with ota-agent, so strip that half back out.
#
# What remains still produces the commit, via the image type chain
#   ota-ext4 -> ota -> ostreecommit -> ostree
IMAGE_FSTYPES:remove = "ostreepush garagesign garagecheck"
SOTA_CLIENT_PROV = ""
IMAGE_INSTALL:remove = "aktualizr aktualizr-info"

# Branch (ref) devices track. One ref per product+variant.
OSTREE_BRANCHNAME = "${MACHINE}-main"
OSTREE_OSNAME = "ota-platform"
OSTREE_REPO ?= "${DEPLOY_DIR_IMAGE}/ostree_repo"
# Baked into the image as the agent's default remote; override per environment.
OSTREE_REMOTE_URL ?= "https://ota.example.com/repo"

# Deterministic builds -> stable ostree commits -> small deltas.
# Nothing to enable: since kirkstone, reproducibility is unconditional in
# base.bbclass (SOURCE_DATE_EPOCH). The old BUILD_REPRODUCIBLE_BINARIES var and
# reproducible_build.bbclass are both gone -- setting them errors out.
# What still matters is not breaking it: pin SRCREV, keep timestamps out of
# binaries, keep do_install deterministic. Verify with:
#   bitbake core-image-minimal -c reproducible_build  (poky's own test target)

# --- QT6 -------------------------------------------------------------------
# Set to eglfs/wayland/linuxfb depending on board graphics stack.
QT_HMI_PLATFORM ?= "eglfs"

# Flip to "1" once the ota-agent repo is pushed and its SRCREV pinned.
OTA_AGENT_ENABLED ?= "0"

# --- Image -----------------------------------------------------------------
# Do NOT add ostreepush here: it is an image type only sota.bbclass defines, so
# setting it globally makes every image recipe in every layer fail to parse with
# "No IMAGE_CMD defined for IMAGE_FSTYPES entry 'ostreepush'".
IMAGE_FSTYPES += "wic.gz wic.bmap"

# Produces ota-image-<machine>.ostree.tar.bz2 -- the archived commit, useful for
# offline transfer to a device that cannot reach the server.
BUILD_OSTREE_TARBALL = "1"

# --- meta-updater RPi fixes -------------------------------------------------
# sota_raspberrypi.bbclass hardcodes overlays/uart0-rpi4.dtbo in
# KERNEL_DEVICETREE and SOTA_DT_OVERLAYS. That overlay was removed from the
# Raspberry Pi kernel, so a sota build of any RPi4 machine dies with:
#   make[3]: *** No rule to make target 'arch/arm64/boot/dts/overlays/uart0-rpi4.dtbo'
# The class uses ?=, so plain assignments here win. Drop the dead overlay.
KERNEL_DEVICETREE:raspberrypi4-64:sota = " broadcom/bcm2711-rpi-4-b.dtb overlays/vc4-fkms-v3d.dtbo"
KERNEL_DEVICETREE:raspberrypi4:sota    = " bcm2711-rpi-4-b.dtb overlays/vc4-fkms-v3d.dtbo"
SOTA_DT_OVERLAYS:raspberrypi4-64 = "vc4-fkms-v3d.dtbo"
SOTA_DT_OVERLAYS:raspberrypi4    = "vc4-fkms-v3d.dtbo"

# --- Build host resources ---------------------------------------------------
# bitbake defaults BOTH of these to nproc, so a 24-core host runs up to
# 24 tasks x 24 make jobs = 576 compiler processes. That exhausts RAM long
# before CPU, and the symptom is nasty: the OOM killer truncates object files
# to 0 bytes, make sees fresh timestamps and never rebuilds them, and the link
# "succeeds" because ICU passes -Wl,--allow-shlib-undefined. You then get
#   symbol lookup error: libicui18n.so.74: undefined symbol: ...MeasureFormat...
# hours later, from a corrupted build tree that a plain retry will not fix.
#
# Rule of thumb: BB_NUMBER_THREADS x PARALLEL_MAKE <= cores, and budget ~2 GB
# of RAM per parallel compile.
BB_NUMBER_THREADS = "8"
PARALLEL_MAKE = "-j 8"

# Scarthgap can also throttle on kernel pressure-stall info, which adapts to
# whatever else is running on the machine (IDEs, browsers, language servers).
BB_PRESSURE_MAX_MEMORY = "5000"
BB_PRESSURE_MAX_CPU = "500"
BB_PRESSURE_MAX_IO = "5000"

# --- Fetching ---------------------------------------------------------------
# Port 9418 (git://) is blocked on most corporate and university networks.
# Fix it once, globally, so every recipe's SRC_URI is rewritten:
#
#     git config --global url."https://".insteadOf git://
#
# Fallback for recipes whose upstream host is unreachable rather than just
# using the wrong protocol — pull tarballs from the Yocto source mirror first:
#
# PREMIRRORS:prepend = "\
#     git://.*/.*     https://downloads.yoctoproject.org/mirror/sources/ \n \
#     ftp://.*/.*     https://downloads.yoctoproject.org/mirror/sources/ \n \
#     http://.*/.*    https://downloads.yoctoproject.org/mirror/sources/ \n \
#     https://.*/.*   https://downloads.yoctoproject.org/mirror/sources/ \n"
#
# Shallow clones cut fetch time and disk use. Off by default because it
# complicates bisecting a layer from inside the build tree.
# BB_GIT_SHALLOW = "1"
